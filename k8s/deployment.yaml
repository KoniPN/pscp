# Deployment สำหรับ Hello World Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello-world
  labels:
    app: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: hello-world
          image: myapp-hello-world:latest # จะถูกอัพเดทโดย Jenkins CI
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: HELLO_MESSAGE
              value: "Hello World from Kubernetes!" # เปลี่ยนข้อความตรงนี้
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

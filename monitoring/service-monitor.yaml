# Prometheus ServiceMonitor สำหรับ scrape metrics จาก Hello World
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello-world-monitor
  namespace: hello-world
  labels:
    app: hello-world
    release: prometheus
spec:
  selector:
    matchLabels:
      app: hello-world
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - hello-world
